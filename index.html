<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chill Space - Multi Playlist Lo-Fi Workspace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      color: #fff;
      overflow: hidden;
      background: #000;
    }

    #bg-video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    .yt-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.15s ease;
      overflow: hidden;
    }
    .yt-wrapper iframe {
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .widget {
      position: absolute;
      background: rgba(18, 18, 28, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 20px 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
    }

    .widget.hidden-ui {
      opacity: 0 !important;
      transform: translateY(16px) !important;
      pointer-events: none !important;
      visibility: hidden;
    }

    button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .widget-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }

    .timer-panel { top: 25px; left: 25px; width: 260px; text-align: center; }
    .timer-display {
      font-size: 2.5rem; font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px; margin: 4px 0; color: #e2e8f0;
    }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }

    .music-panel { bottom: 25px; left: 25px; width: 380px; }
    
    .pl-selector-group {
      display: flex; gap: 6px; margin-bottom: 10px; align-items: center;
    }
    .pl-select {
      flex: 1; padding: 6px 10px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.6);
      color: #fff; font-size: 0.85rem; outline: none;
    }

    .track-info {
      font-size: 0.95rem; font-weight: 600; color: #f1f5f9;
      text-overflow: ellipsis; white-space: nowrap; overflow: hidden; margin-bottom: 12px;
    }

    .video-settings {
      background: rgba(0, 0, 0, 0.3); border-radius: 12px;
      padding: 12px; margin-bottom: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; flex-direction: column; gap: 8px;
    }
    .slider-header-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); }
    .range-slider {
      -webkit-appearance: none; width: 100%; height: 5px;
      border-radius: 3px; background: rgba(255, 255, 255, 0.2); outline: none; cursor: pointer;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #a29bfe;
    }

    .yt-input-group { display: flex; gap: 6px; margin-bottom: 12px; }
    .yt-input {
      flex: 1; padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4);
      color: #fff; font-size: 0.8rem; outline: none;
    }

    .controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .controls button { flex: 1; margin: 0 4px; }

    .playlist-container {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px; max-height: 120px; overflow-y: auto;
    }
    .playlist-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; margin-bottom: 4px; background: rgba(255, 255, 255, 0.05);
      border-radius: 6px; font-size: 0.8rem;
    }
    .playlist-item.active { background: rgba(162, 155, 254, 0.25); border: 1px solid rgba(162, 155, 254, 0.4); }
    .playlist-item-title { cursor: pointer; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 280px; }
    .del-btn { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 0.8rem; padding: 0 4px; }

    .todo-panel { bottom: 25px; right: 25px; width: 300px; max-height: 400px; display: flex; flex-direction: column; }
    
    .auth-container { top: 25px; right: 25px; width: 280px; }
    .signup-form, .login-form {
      display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    }
    .signup-form input, .login-form input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(0, 0, 0, 0.35); color: #fff; outline: none;
    }
    .status-msg {
      margin-top: 8px; min-height: 20px; font-size: 0.8rem; color: rgba(255,255,255,0.8);
    }
    .status-msg.success { color: #7ef0a8; }
    .status-msg.error { color: #ff8f8f; }

    .profile-box {
      display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
    }
    .profile-name { font-size: 1.1rem; font-weight: 700; color: #a29bfe; }

    .todo-input {
      width: 100%; padding: 10px 14px; margin-top: 8px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18); background: rgba(0, 0, 0, 0.35); color: #fff; outline: none;
    }
    .todo-list { list-style: none; margin-top: 12px; overflow-y: auto; max-height: 230px; }
    .todo-list li {
      padding: 8px 12px; margin-bottom: 6px; background: rgba(255,255,255,0.06);
      border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.88rem;
    }
    .todo-list li.done { text-decoration: line-through; opacity: 0.45; }

    .arrow-toggle-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(18, 18, 28, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .arrow-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      transform: translateX(-50%) scale(1.08);
    }
    .arrow-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .arrow-toggle-btn.is-hidden .arrow-icon {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay loop muted>
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="yt-wrapper" id="yt-wrapper">
    <div id="player"></div>
  </div>

  <button id="toggle-ui-btn" class="arrow-toggle-btn" title="UI 토글">
    <svg class="arrow-icon" viewBox="0 0 24 24">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- 1. 타이머 패널 -->
  <div class="widget timer-panel main-widget">
    <div class="widget-title">YOUTUBE TIMER</div>
    <div class="timer-display" id="timer-display">00:00:00</div>
    <div class="btn-group">
      <button id="timer-start-btn">▶ 재생</button>
      <button id="timer-reset-btn">↺ 처음부터</button>
    </div>
  </div>

  <!-- 2. 유튜브 플레이어 패널 -->
  <div class="widget music-panel main-widget">
    <div class="widget-title">YOUTUBE LO-FI PLAYER</div>
    
    <div class="pl-selector-group">
      <select id="playlist-select" class="pl-select"></select>
      <button id="create-pl-btn">+ 새 플리</button>
      <button id="delete-pl-btn" class="del-btn" style="padding: 6px 10px;">삭제</button>
    </div>

    <div class="track-info" id="track-title">로그인이 필요합니다</div>

    <div class="video-settings">
      <div class="slider-header-labels">
        <span>투명도 (영상 보임 정도)</span>
        <span id="opacity-val">50%</span>
      </div>
      <input type="range" id="opacitySlider" class="range-slider" min="0" max="100" value="50">
    </div>

    <div class="yt-input-group">
      <input type="text" id="yt-url-input" class="yt-input" placeholder="유튜브 URL 또는 ID 입력">
      <button id="yt-add-btn">+ 추가</button>
    </div>

    <div class="controls">
      <button id="prev-btn">◀ 이전</button>
      <button id="play-btn">▶ 재생</button>
      <button id="next-btn">다음 ▶</button>
    </div>

    <div class="playlist-container" id="playlist-list"></div>
  </div>

  <!-- 3. 회원 관리 패널 (우상단) -->
  <div class="widget auth-container main-widget">
    <!-- 로그인 상태일 때 표시 -->
    <div id="logged-in-box" class="profile-box" style="display: none;">
      <div class="widget-title">USER PROFILE</div>
      <div class="profile-name" id="user-display-name"></div>
      <button id="logout-btn" style="width: 100%;">로그아웃</button>
    </div>

    <!-- 비로그인 상태일 때 표시 -->
    <div id="logged-out-box">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
        <button id="show-login-tab" style="flex:1; margin-right: 4px;">로그인</button>
        <button id="show-signup-tab" style="flex:1; margin-left: 4px;">회원가입</button>
      </div>

      <!-- 로그인 폼 -->
      <form id="login-form" class="login-form">
        <input type="text" id="login-username" placeholder="아이디 또는 이메일" required>
        <input type="password" id="login-password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
        <div id="login-status" class="status-msg"></div>
      </form>

      <!-- 회원가입 폼 -->
      <form id="signup-form" class="signup-form" style="display: none;">
        <input type="text" id="signup-username" placeholder="아이디" maxlength="20" required>
        <input type="email" id="signup-email" placeholder="이메일" required>
        <input type="password" id="signup-password" placeholder="비밀번호 (6자 이상)" minlength="6" required>
        <button type="submit">회원가입</button>
        <div id="signup-status" class="status-msg"></div>
      </form>
    </div>
  </div>

  <!-- 4. 투두 리스트 패널 -->
  <div class="widget todo-panel main-widget">
    <div class="widget-title">TO-DO LIST</div>
    <input type="text" id="todo-input" class="todo-input" placeholder="할 일 입력 후 Enter">
    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let playlists = [];
    let currentPlaylistId = null;
    let playlist = [];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let timerInterval = null;
    let isUiVisible = true;
    let currentUser = null; // 현재 세션 유저 정보 { id, username }

    // UI 토글
    const toggleUiBtn = document.getElementById('toggle-ui-btn');
    const mainWidgets = document.querySelectorAll('.main-widget');

    toggleUiBtn.addEventListener('click', () => {
      isUiVisible = !isUiVisible;
      mainWidgets.forEach(widget => {
        if (isUiVisible) widget.classList.remove('hidden-ui');
        else widget.classList.add('hidden-ui');
      });
      toggleUiBtn.classList.toggle('is-hidden', !isUiVisible);
    });

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      const s = Math.floor(seconds);
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'rel': 0, 'modestbranding': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayButtons();
        startTimerLoop();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayButtons();
        stopTimerLoop();
      } else if (event.data === YT.PlayerState.ENDED) {
        isPlaying = false;
        stopTimerLoop();
        nextTrack();
      }
    }

    function calculateTotalRemainingTime() {
      if (playlist.length === 0) return 0;
      const currentTrackDuration = playlist[currentTrackIndex]?.duration || (player ? player.getDuration() : 0);
      const currentTrackTime = player && player.getCurrentTime ? player.getCurrentTime() : 0;

      let totalRemaining = Math.max(0, currentTrackDuration - currentTrackTime);
      for (let i = currentTrackIndex + 1; i < playlist.length; i++) {
        totalRemaining += (playlist[i].duration || 0);
      }
      return totalRemaining;
    }

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (player && player.getCurrentTime) {
          const totalRemaining = calculateTotalRemainingTime();
          document.getElementById('timer-display').innerText = formatTime(totalRemaining);
        }
      }, 500);
    }

    function stopTimerLoop() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function extractYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    // --- 유저 정보 & 세션 체크 ---
    function checkUserSession() {
      const savedUser = localStorage.getItem('chill_space_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('user-display-name').innerText = `${currentUser.username}님`;
        document.getElementById('logged-in-box').style.display = 'flex';
        document.getElementById('logged-out-box').style.display = 'none';
        
        fetchPlaylists();
        fetchTodos();
      } else {
        currentUser = null;
        document.getElementById('logged-in-box').style.display = 'none';
        document.getElementById('logged-out-box').style.display = 'block';
        document.getElementById('playlist-select').innerHTML = '';
        document.getElementById('playlist-list').innerHTML = '';
        document.getElementById('todo-list').innerHTML = '';
        document.getElementById('track-title').innerText = "로그인이 필요합니다";
        if (player && player.stopVideo) player.stopVideo();
      }
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('chill_space_user');
      checkUserSession();
    });

    // 탭 전환 (로그인/회원가입)
    document.getElementById('show-login-tab').addEventListener('click', () => {
      document.getElementById('login-form').style.display = 'flex';
      document.getElementById('signup-form').style.display = 'none';
    });
    document.getElementById('show-signup-tab').addEventListener('click', () => {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('signup-form').style.display = 'flex';
    });

    // --- API 요청 ---
    async function fetchPlaylists() {
      if (!currentUser) return;
      const res = await fetch(`/api/playlists?user_id=${currentUser.id}`);
      playlists = await res.json();
      
      const selectEl = document.getElementById('playlist-select');
      selectEl.innerHTML = '';
      playlists.forEach(pl => {
        const opt = document.createElement('option');
        opt.value = pl.id;
        opt.innerText = pl.name;
        if (pl.id === currentPlaylistId) opt.selected = true;
        selectEl.appendChild(opt);
      });

      if (playlists.length > 0) {
        if (!playlists.find(p => p.id === currentPlaylistId)) {
          currentPlaylistId = playlists[0].id;
        }
        fetchPlaylistItems();
      } else {
        playlist = [];
        renderPlaylist();
      }
    }

    async function fetchPlaylistItems() {
      if (!currentPlaylistId) return;
      const res = await fetch(`/api/playlists/${currentPlaylistId}/items`);
      playlist = await res.json();
      currentTrackIndex = 0;
      renderPlaylist();

      if (playlist.length > 0 && player && player.cueVideoById) {
        loadTrack(0, false);
      } else if (playlist.length === 0) {
        document.getElementById('track-title').innerText = "영상이 없습니다";
        if (player && player.stopVideo) player.stopVideo();
      }
      
      const totalRemaining = calculateTotalRemainingTime();
      document.getElementById('timer-display').innerText = formatTime(totalRemaining);
    }

    function renderPlaylist() {
      const listEl = document.getElementById('playlist-list');
      listEl.innerHTML = '';
      playlist.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `playlist-item ${idx === currentTrackIndex ? 'active' : ''}`;
        div.innerHTML = `
          <span class="playlist-item-title">${idx + 1}. ${item.title}</span>
          <button class="del-btn" onclick="deletePlaylistItem(${item.id})">✕</button>
        `;
        div.querySelector('.playlist-item-title').addEventListener('click', () => {
          loadTrack(idx, true);
        });
        listEl.appendChild(div);
      });
    }

    function loadTrack(index, autoPlay = true) {
      if (playlist.length === 0) return;
      currentTrackIndex = index;
      const track = playlist[index];
      document.getElementById('track-title').innerText = track.title;
      
      if (player && player.loadVideoById) {
        if (autoPlay) {
          player.loadVideoById(track.youtube_id);
        } else {
          player.cueVideoById(track.youtube_id);
        }
      }
      renderPlaylist();
    }

    function togglePlay() {
      if (!player || playlist.length === 0) return;
      if (isPlaying) player.pauseVideo();
      else player.playVideo();
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      loadTrack(currentTrackIndex, true);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentTrackIndex, true);
    }

    function updatePlayButtons() {
      const text = isPlaying ? '❚❚ 일시정지' : '▶ 재생';
      document.getElementById('play-btn').innerText = text;
      document.getElementById('timer-start-btn').innerText = text;
    }

    document.getElementById('play-btn').addEventListener('click', togglePlay);
    document.getElementById('timer-start-btn').addEventListener('click', togglePlay);
    document.getElementById('next-btn').addEventListener('click', nextTrack);
    document.getElementById('prev-btn').addEventListener('click', prevTrack);

    document.getElementById('playlist-select').addEventListener('change', (e) => {
      currentPlaylistId = parseInt(e.target.value);
      fetchPlaylistItems();
    });

    document.getElementById('create-pl-btn').addEventListener('click', async () => {
      if (!currentUser) return alert("로그인이 필요합니다.");
      const name = prompt("새 플레이리스트 이름을 입력하세요:");
      if (!name) return;

      const res = await fetch('/api/playlists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: currentUser.id, name: name.trim() })
      });
      const data = await res.json();
      currentPlaylistId = data.id;
      fetchPlaylists();
    });

    document.getElementById('delete-pl-btn').addEventListener('click', async () => {
      if (!currentUser) return;
      if (playlists.length <= 1) {
        alert("최소 하나의 플레이리스트는 유지되어야 합니다.");
        return;
      }
      if (!confirm("현재 선택된 플레이리스트를 삭제하시겠습니까?")) return;

      await fetch(`/api/playlists/${currentPlaylistId}?user_id=${currentUser.id}`, { method: 'DELETE' });
      currentPlaylistId = playlists[0].id;
      fetchPlaylists();
    });

    document.getElementById('yt-add-btn').addEventListener('click', async () => {
      if (!currentUser) return alert("로그인이 필요합니다.");
      const input = document.getElementById('yt-url-input');
      const addBtn = document.getElementById('yt-add-btn');
      const val = input.value.trim();
      if (!val) return;

      const ytId = extractYoutubeId(val);
      const titleName = `YouTube Track (${ytId})`;

      addBtn.disabled = true;
      addBtn.innerText = "분석 중...";

      await fetch('/api/playlist/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playlist_id: currentPlaylistId, title: titleName, youtube_id: ytId })
      });

      input.value = '';
      addBtn.disabled = false;
      addBtn.innerText = "+ 추가";
      
      fetchPlaylistItems();
    });

    async function deletePlaylistItem(itemId) {
      await fetch(`/api/playlist/items/${itemId}`, { method: 'DELETE' });
      fetchPlaylistItems();
    }

    const opacitySlider = document.getElementById('opacitySlider');
    const opacityVal = document.getElementById('opacity-val');
    const ytWrapper = document.getElementById('yt-wrapper');
    opacitySlider.addEventListener('input', (e) => {
      const val = e.target.value;
      opacityVal.innerText = `${val}%`;
      ytWrapper.style.opacity = val / 100;
    });

    // --- To-Do ---
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');

    async function fetchTodos() {
      if (!currentUser) return;
      const res = await fetch(`/api/todos?user_id=${currentUser.id}`);
      const data = await res.json();
      todoList.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.innerText = item.text;
        if (item.done) li.classList.add('done');
        
        li.addEventListener('click', async (e) => {
          if (e.target.tagName === 'BUTTON') return;
          await fetch(`/api/todos/${item.id}?user_id=${currentUser.id}`, { method: 'PUT' });
          li.classList.toggle('done');
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.innerText = '✕';
        delBtn.addEventListener('click', async () => {
          await fetch(`/api/todos/${item.id}?user_id=${currentUser.id}`, { method: 'DELETE' });
          fetchTodos();
        });

        li.appendChild(delBtn);
        todoList.appendChild(li);
      });
    }

    todoInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter' && todoInput.value.trim() !== '') {
        if (!currentUser) return alert("로그인이 필요합니다.");
        const text = todoInput.value.trim();
        await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.id, text: text, done: false })
        });
        todoInput.value = '';
        fetchTodos();
      }
    });

    // --- Auth Form Handlers ---
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('signup-status');
      const username = document.getElementById('signup-username').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value.trim();

      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();

      if (data.success) {
        statusEl.textContent = data.message;
        statusEl.className = 'status-msg success';
        document.getElementById('signup-form').reset();
      } else {
        statusEl.textContent = data.message;
        statusEl.className = 'status-msg error';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('login-status');
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        statusEl.textContent = data.message;
        statusEl.className = 'status-msg success';
        // 로컬 스토리지에 유저 세션 저장
        localStorage.setItem('chill_space_user', JSON.stringify({ id: data.user_id, username: data.username }));
        checkUserSession();
      } else {
        statusEl.textContent = data.message;
        statusEl.className = 'status-msg error';
      }
    });

    setTimeout(() => {
      checkUserSession();
    }, 500);
  </script>
</body>
</html>
