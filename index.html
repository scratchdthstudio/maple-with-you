<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 및 로그인 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 48%; padding: 10px; margin-top: 10px; cursor: pointer; }
        .btn-container { display: flex; justify-content: space-between; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        #user-info { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <h2>인증 시스템 테스트</h2>

    <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" placeholder="아이디 입력">
    </div>
    <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
    </div>

    <div class="btn-container">
        <button onclick="handleRegister()">회원가입</button>
        <button onclick="handleLogin()">로그인</button>
    </div>

    <div id="message"></div>

    <div id="user-info">
        <h3>로그인 정보</h3>
        <p id="user-display"></p>
        <button onclick="handleLogout()" style="width: 100%;">로그아웃</button>
    </div>

    <script>
        const showMessage = (msg, isError = false) => {
            const box = document.getElementById('message');
            box.style.display = 'block';
            box.className = isError ? 'error' : 'success';
            box.innerText = msg;
        };

        // 회원가입 (JSON 전송)
        async function handleRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return showMessage('아이디와 비밀번호를 입력해주세요.', true);

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '가입 실패');

                showMessage(data.message);
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        // 로그인 (x-www-form-urlencoded 전송 - FastAPI Form 규격)
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) return showMessage('아이디와 비밀번호를 입력해주세요.', true);

            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || '로그인 실패');

                localStorage.setItem('token', data.access_token);
                showMessage('로그인 성공!');
                checkAuth();
            } catch (err) {
                showMessage(err.message, true);
            }
        }

        // 로그인 상태 확인 API 호출
        async function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('user-info').style.display = 'none';
                return;
            }

            try {
                const res = await fetch('/api/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('인증 만료');
                const data = await res.json();

                document.getElementById('user-display').innerText = `접속자: ${data.username}`;
                document.getElementById('user-info').style.display = 'block';
            } catch (err) {
                handleLogout();
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            document.getElementById('user-info').style.display = 'none';
            showMessage('로그아웃되었습니다.');
        }

        // 페이지 로드 시 로그인 유무 확인
        window.onload = checkAuth;
    </script>
</body>
</html>
